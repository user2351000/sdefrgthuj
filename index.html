<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>TryCloudflare Launcher</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #0b1120; color: #f8fafc;
    }
    main {
      width: min(100%, 520px); padding: 30px; border: 1px solid #334155;
      border-radius: 20px; background: #111827; box-shadow: 0 20px 60px #0006;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { color: #aab7ca; line-height: 1.6; }
    label { display: block; margin: 24px 0 8px; font-weight: 600; }
    input {
      width: 100%; padding: 14px; border: 1px solid #475569; border-radius: 10px;
      background: #0b1220; color: white; font: inherit; outline: none;
    }
    input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px #3b82f633; }
    button {
      width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 10px;
      background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { min-height: 24px; margin-top: 14px; font-size: 14px; }
    .hint { margin-top: 22px; padding: 12px; border-radius: 10px; background: #1e293b; font-size: 13px; }
    code { overflow-wrap: anywhere; color: #bfdbfe; }
  </style>
</head>
<body>
  <main>
    <h1>TryCloudflare Launcher</h1>
    <p>Cloudflare Tunnel のURLを入力して開きます。</p>

    <form id="launcherForm">
      <label for="targetUrl">TryCloudflare URL</label>
      <input id="targetUrl" type="url"
        placeholder="https://example.trycloudflare.com/"
        autocomplete="url" spellcheck="false" required>
      <button id="openButton" type="submit">新しいウィンドウで開く</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <div class="hint">
      対応形式：<code>https://任意のサブドメイン.trycloudflare.com/</code><br>
      HTTPSのみ対応。URLのパス、クエリ、フラグメントも維持します。
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
